name: Slow-Checks

on:
  workflow_call:

jobs:
  build-matrix-binary-int-test-config:
    name: Generate Build Matrix for binary integration tests
    uses: ./.github/workflows/matrix.yml
    with:
      matrix_keys_json: '["binary_int_test_config"]'
    permissions:
      contents: read

  build-matrix-int-test-config:
    name: Generate Build Matrix for package integration tests
    uses: ./.github/workflows/matrix.yml
    with:
      matrix_keys_json: '["int_test_config"]'
    permissions:
      contents: read

  binary-tests:
    name: Binary-Integration-Tests (Runner-${{ matrix.runner }} TestImgBase-${{matrix.ubuntu_img_int_test}})
    needs:
      - build-matrix-binary-int-test-config
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix-binary-int-test-config.outputs.matrix).binary_int_test_config[0] }}

    steps:
      - name: Check out Repository
        id: check-out-repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python & Poetry Environment
        id: set-up-python-and-poetry-environment
        uses: exasol/python-toolbox/.github/actions/python-environment@v10
        with:
          python-version: "3.10"
          poetry-version: "2.3.0"

      - name: Build binary build image
        id: build-binary-build-image
        run: poetry run -- nox -s build-binary-build-image

      - name: Run Binary Integration Tests
        id: run-binary-integration-tests
        run: poetry run -- nox -s test:integration -- --coverage --test-image-ubuntu-version ${{matrix.ubuntu_img_int_test}} -m "via_binary" # zizmor: ignore[template-injection] - matrix values are controlled by this workflow's generated matrix

      - name: Upload Artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python3.10-${{matrix.runner}}-${{matrix.ubuntu_img_int_test}}-binary-slow
          path: .coverage
          include-hidden-files: true
          overwrite: false

  package-tests:
    name: Package-Integration-Tests (Python-${{ matrix.python_version }} Runner-${{ matrix.runner }} TestImgBase-${{matrix.ubuntu_img_int_test}})
    needs:
      - build-matrix-int-test-config
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix-int-test-config.outputs.matrix).int_test_config[0] }}

    steps:
      - name: Check out Repository
        id: check-out-repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python & Poetry Environment
        id: set-up-python-and-poetry-environment
        uses: exasol/python-toolbox/.github/actions/python-environment@v10
        with:
          python-version: ${{ matrix.python_version }}
          poetry-version: "2.3.0"

      - name: Run Package Integration Tests
        id: run-package-integration-tests
        run: poetry run -- nox -s test:integration -- --coverage --test-image-ubuntu-version ${{matrix.ubuntu_img_int_test}} -m "not via_binary" # zizmor: ignore[template-injection] - matrix values are controlled by this workflow's generated matrix

      - name: Upload Artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python${{ matrix.python_version }}-${{matrix.runner}}-${{matrix.ubuntu_img_int_test}}-package-slow
          path: .coverage
          include-hidden-files: true
          overwrite: false
