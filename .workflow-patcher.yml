workflows:
  - name: build-and-publish
    step_customizations:
      - action: INSERT_AFTER
        job: build-and-publish
        step_id: publish-release-to-github
        content:
          - name: GitHub Latest tag
            id: push-latest-tag
            continue-on-error: true
            env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
                -f sha="${GITHUB_SHA}" -F force=true
              echo "Updated latest tag to ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
