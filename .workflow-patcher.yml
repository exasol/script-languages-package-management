workflows:
  - name: build-and-publish
    step_customizations:
      - action: INSERT_AFTER
        job: build-and-publish
        step_id: publish-release-to-github
        content:
          - name: GitHub Latest tag
            id: push-latest-tag
            continue-on-error: true
            env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              ref="repos/${GITHUB_REPOSITORY}/git/refs/tags/latest"
              if gh api "$ref" >/dev/null 2>&1; then
                gh api --method PATCH "$ref" -f sha="${GITHUB_SHA}" -F force=true
              else
                gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                  -f ref=refs/tags/latest -f sha="${GITHUB_SHA}"
              fi
              echo "Updated latest tag to ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
