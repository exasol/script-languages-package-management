workflows:
  - name: checks
    # This is needed because the `cd.yml` has a minor manual modification.
    # This job will be re-activated in:
    #   https://github.com/exasol/script-languages-package-management/issues/149
    remove_jobs:
      - check-workflows
  - name: build-and-publish
    step_customizations:
      - action: INSERT_AFTER
        job: build-and-publish
        step_id: publish-release-to-github
        content:
          - name: GitHub Latest tag
            id: push-latest-tag
            run: |
              git tag -f latest
              git push --force origin latest